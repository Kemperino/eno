[package]
name = "eno"
version = "0.1.0"
edition = "2021"
description = "Minimalist agent orchestration tool for parallel AI coding sessions"
authors = ["eno contributors"]
license = "MIT"
repository = "https://github.com/your-org/eno"
keywords = ["ai", "agents", "orchestration", "tmux", "git"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
colored = "2.1"
dialoguer = "0.11"
indicatif = "0.17"
dirs = "5.0"
uuid = { version = "1.6", features = ["v4"] }
which = "6.0"
tabled = "0.15"

[profile.release]
lto = true
strip = true
